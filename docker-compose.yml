version: '3.8'

services:
  telegram-receipt-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_receipt_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import app.config; print(\"OK\")'"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bot_data:
